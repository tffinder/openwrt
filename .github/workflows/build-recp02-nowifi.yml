name: Build RE-CP-02 (no WiFi)

on:
  workflow_dispatch:
  push:
    branches: [no-wifi-recp02]
    paths:
      - ".github/workflows/build-recp02-nowifi.yml"
      - ".config.seed"
      - "target/linux/ramips/image/mt7621.mk"

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build essentials
        run: |
          sudo apt update
          sudo apt install -y build-essential bison ccache clang cmake device-tree-compiler \
            flex g++ gawk gcc gettext git libelf-dev libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig time unzip wget zlib1g-dev file

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ github.event.repository.name }}-${{ hashFiles('.config.seed') }}
          restore-keys: dl-${{ github.event.repository.name }}-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp .config.seed .config
          make defconfig

      - name: Fail fast - requested packages must exist as kconfig symbols
        run: |
          REQ="luci luci-app-firewall udpxy luci-app-udpxy tcpdump luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn"
          missing=""
          for p in $REQ; do
            grep -qE "^(CONFIG_PACKAGE_${p}=|# CONFIG_PACKAGE_${p} is not set)" .config || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::以下请求的包在 kconfig 中不存在:$missing"
            echo "--- 相关可用符号（前 25 个）---"
            if [ -f tmp/.config-package.in ]; then
              grep -ohE "PACKAGE_luci-i18n[a-zA-Z0-9_.-]*" tmp/.config-package.in | sed 's/^/  /' | sort -u | head -25
              echo "--- udpxy 相关 ---"
              grep -ohE "PACKAGE_[a-z0-9_.-]*udpxy[a-zA-Z0-9_.-]*" tmp/.config-package.in | sed 's/^/  /' | sort -u
            else
              echo "tmp/.config-package.in 不存在，无法列出候选符号"
            fi
            exit 1
          fi
          echo "OK: 所有请求的包均存在于 kconfig"

      - name: Preflight - WiFi symbols after defconfig
        run: |
          echo "=== 仍被选中的无线相关符号（应为空）==="
          awk -F= '/^CONFIG_PACKAGE_/{print $1}' .config \
            | grep -E '^(CONFIG_PACKAGE_)(kmod-mt7915e|kmod-mt7915-firmware|kmod-mt76|kmod-mt76-core|kmod-mt76-connac|kmod-mac80211|kmod-cfg80211|wpad.*|wireless-regdb|iw)$' \
            && { echo "::error::WiFi packages still selected"; exit 1; } \
            || echo "OK: none selected"
          echo "=== 确认保留的工具/界面 ==="
          grep -E '^CONFIG_PACKAGE_(luci|udpxy|luci-app-udpxy|tcpdump)=' .config || echo "(部分包在源中不存在，将被跳过)"

      - name: Download package sources
        run: make -j$(nproc) download

      - name: Build
        run: make -j$(nproc) 2>&1 | tee build.log

      - name: Assert final image contains no WiFi
        run: |
          set -e
          ls -l bin/targets/ramips/mt7621/ | head -30
          MAN=$(find bin/targets/ramips/mt7621 -name '*re-cp-02*packages.manifest*' -o -name '*re-cp-02*manifest' | head -1)
          if [ -z "$MAN" ]; then echo "::error::package manifest not found"; exit 1; fi
          echo "manifest: $MAN ($(wc -l < "$MAN") packages)"
          if awk '{print $1}' "$MAN" | grep -qE '^(kmod-mt7915e|kmod-mt7915-firmware|kmod-mt76|kmod-mt76-core|kmod-mt76-connac|kmod-mac80211|kmod-cfg80211|wpad-.*|wireless-regdb|iw)$'; then
            echo "::error::WiFi packages present in final image:"
            awk '{print $1}' "$MAN" | grep -E '^(kmod-mt7915e|kmod-mt76.*|kmod-mac80211|kmod-cfg80211|wpad-.*|wireless-regdb|iw)$'
            exit 1
          fi
          echo "PASS: 最终镜像内无任何 WiFi 驱动/固件/hostapd"
          echo "--- 请求的包是否真的进了镜像 ---"
          MISS=""
          for p in luci luci-app-firewall udpxy luci-app-udpxy tcpdump luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn; do
            awk '{print $1}' "$MAN" | grep -qx "$p" || MISS="$MISS $p"
          done
          if [ -n "$MISS" ]; then echo "::error::镜像里缺少这些包:$MISS"; exit 1; fi
          echo "PASS: 请求的包全部进入镜像"
          {
            echo "## 镜像结果"
            echo "- 包总数: $(wc -l < "$MAN")"
            echo "- 无 WiFi 断言: PASS"
            echo
            echo '```'
            ls -l bin/targets/ramips/mt7621/*.bin 2>/dev/null
            cat bin/targets/ramips/mt7621/sha256sums 2>/dev/null | grep re-cp-02
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show tail of log on failure
        if: failure()
        run: tail -n 120 build.log || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recp02-nowifi-${{ github.event.repository.name }}
          if-no-files-found: error
          path: |
            bin/targets/ramips/mt7621/*.bin
            bin/targets/ramips/mt7621/*manifest*
            bin/targets/ramips/mt7621/sha256sums
            bin/targets/ramips/mt7621/*.buildinfo
            .config
